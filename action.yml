name: Copilot review gate
description: >-
  Block a merge until GitHub Copilot has genuinely reviewed the pull request.
  Publishes a stable status check you can mark required, and tells a real review
  apart from both of Copilot's non-reviews — the backend apology worth retrying,
  and its settled "nothing here to review", which no retry can change.
author: hacker-cb

branding:
  icon: shield
  color: purple

inputs:
  github-token:
    description: >-
      Token used to read the PR's reviews and to re-request a review. The default
      job token is enough; it needs `pull-requests: write`, which buys exactly one
      operation — adding Copilot back as a reviewer.
    required: false
    default: ${{ github.token }}

  wait-minutes:
    description: >-
      How long to wait for the PR's first genuine Copilot review before failing
      closed. The first review historically lands within ~3.5 min end-to-end.
      Under `require-head-review` this window has to cover the whole
      push-to-review cycle rather than a review already in flight — measured at
      a few minutes typically, and occasionally longer — mostly when GitHub is
      slow to file the request rather than Copilot slow to review.
      The action wraps its own script in `timeout` at this value plus one poll
      interval plus a two-minute grace, so there is no second number to keep in
      sync. That ceiling is the STEP's, not the job's — a composite action cannot
      set `timeout-minutes` — and the README says what it does and does not cover.
    required: false
    default: "15"

  max-rerequests:
    description: >-
      How many times to ask Copilot again after it answers without reviewing.
      Bounded on purpose: a backend that is down stays down, and the wait window
      is the real limit anyway. Only successful requests count against it.
      Under `require-head-review` the budget answers a different question — it is
      spent when GitHub has no review request outstanding for the head, which is
      the push Copilot did not re-review, not a reply it sent. Setting it to zero
      there removes the only thing that unblocks such a push.
    required: false
    default: "2"

  poll-seconds:
    description: >-
      Seconds between polls of the reviews API. It also lands in the hard ceiling
      described under `wait-minutes`: the loop tests its deadline before sleeping,
      so the script runs up to one poll interval past its own window.
    required: false
    default: "30"

  require-head-review:
    description: >-
      Whether only a review of the pull request's CURRENT HEAD passes the gate.
      `false` (default) keeps the behaviour every version so far has had: any
      genuine Copilot review of the pull request clears it, on whatever commit.
      That is deliberately loose — Copilot does not re-review every push, and a
      push that only applies its own suggestions typically gets no fresh review,
      so demanding one would dead-lock a merge nothing can unblock.
      `true` buys "merge on green" as a MECHANISM instead of as the discipline of
      whoever drives the merge. The review of a new head lands 4-6 min after the
      push, which is routinely AFTER the pull request's CI has gone green, so a
      gate happy with any review merges a head Copilot never looked at — measured
      at roughly a third of the pull requests merged in one repository over two
      days.
      What pays for the dead-lock above is the re-request, which changes shape
      here: rather than answering a refusal, the gate asks again only when
      GitHub has no Copilot review request outstanding on the pull request —
      which is exactly the push Copilot decided not to re-review — and waits
      when one is pending, so it never produces the duplicate reviews an
      unconditional `gh pr edit --add-reviewer` does. `max-rerequests: 0` turns
      that mechanism off and brings the dead-lock back; the gate warns when the
      two are set that way.
      The cost is roughly 4-6 min on a pull request's final push (CI and the
      review run concurrently, so it is the tail that shows), and `wait-minutes`
      has to cover the whole push-to-review cycle rather than just the review.
      Under `true` the `reviewers` allowlist must keep BOTH of Copilot's logins:
      the outstanding-request check reads the one GitHub files a review request
      under, which is not the one that authors the review.
    required: false
    default: "false"

  reviewers:
    description: >-
      Logins that count as Copilot, one per line. An ALLOWLIST, never a
      `copilot` prefix: several apps in the Copilot family carry a login with
      that prefix, and for a merge gate one false match costs a merge. Two
      spellings because the bot answers to a different one per API surface — the
      reviews endpoint says `copilot-pull-request-reviewer[bot]`, while the
      timeline says `Copilot`, both for the review request and for the review
      event. Under `require-head-review` the second is load-bearing: the
      outstanding-request check reads that surface, and an allowlist without it
      answers "nothing pending" forever.
      The account must also be of type `Bot`, which no input can relax.
    required: false
    default: |
      copilot-pull-request-reviewer[bot]
      copilot

  review-markers:
    description: >-
      Body substrings that mark a review as genuine, one per line; matching any
      one is enough, case-insensitively. Copilot changed its review format in
      August 2026 — the old one opens with a `## Pull request overview` heading,
      the new one moves that text into a `<details><summary>`, and its later
      reviews on the same PR drop the overview section entirely, keeping only a
      `Review details` block. Both defaults below are needed to cover that, and
      neither appears in any refusal body. Add an entry rather than replacing the
      list when a new format appears.
    required: false
    default: |
      pull request overview
      <summary>review details

  unable-to-review:
    description: >-
      What a settled "there was nothing to review" answer from Copilot does to
      the gate: `pass` (default) or `fail`. Copilot answers that way — promptly
      and deterministically — for whole classes of legitimate pull requests: an
      empty-file deletion, a pure rename, a binary-only or lockfile-only change.
      It is its FINAL word on that diff, not a review still coming, so the gate
      stops waiting either way and never re-requests: the same diff gets the same
      answer. It counts only for the pull request's CURRENT head — the same
      answer against an older commit says nothing about the code pushed since,
      so the gate goes on waiting and re-requesting there. `pass` because
      demanding a review of an unreviewable diff blocks a merge nothing can
      unblock, which in practice launders the requirement into an admin bypass —
      the muscle this gate exists to keep people from building.
      SET `fail` IF YOUR REPOSITORY USES COPILOT CONTENT EXCLUSION, or has
      paths whose file types Copilot does not support: the same sentence is what
      it answers when every changed file was excluded from its view, and there
      the diff is ordinary code that simply nobody read. `pass` is chosen for
      the unreviewable-diff case, and it cannot tell the two apart.
    required: false
    default: "pass"

  unable-to-review-markers:
    description: >-
      Body substrings that mark an answer as that settled "nothing to review",
      one per line; matching any one is enough, case-insensitively. Distinct from
      `review-markers` and from an unrecognised body, which keeps the gate waiting
      and gets re-requested — this list is the one that ends the wait, and it is
      therefore the only fail-OPEN surface here: a marker matching one word too
      few opens a merge instead of holding it. So the defaults keep `wasn't`,
      which is what tells the settled answer apart from a transient failure
      phrased around "was unable to review" — and carry it twice, because
      Copilot mixes the ASCII and typographic apostrophes inside a single body
      and a marker with one of them misses the other. An empty list turns the
      class off entirely and restores the behaviour this gate had before it
      existed.
    required: false
    default: |
      wasn't able to review any files
      wasn’t able to review any files

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        IS_DRAFT: ${{ github.event.pull_request.draft }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        WAIT_MINUTES_IN: ${{ inputs.wait-minutes }}
        MAX_REREQUESTS: ${{ inputs.max-rerequests }}
        POLL_SECONDS: ${{ inputs.poll-seconds }}
        REVIEWERS: ${{ inputs.reviewers }}
        MARKERS: ${{ inputs.review-markers }}
        UNABLE_POLICY: ${{ inputs.unable-to-review }}
        UNABLE_MARKERS: ${{ inputs.unable-to-review-markers }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REQUIRE_HEAD_REVIEW: ${{ inputs.require-head-review }}
        # A constant, and an input on purpose is what it is NOT: it describes how
        # long GitHub takes to register the review request it makes itself
        # — where GitHub files the request it does so within seconds, so this is
        # the read rate rather than a lag to wait out. It
        # is passed here rather than left to the script's own default so that a
        # value in the calling job's `env:` cannot reach in and turn the debounce
        # off — a step's `env:` wins over the job's, and the script's `:=` default
        # would not have.
        HEAD_REQUEST_GRACE: "120"
      # Every value reaches the script through `env:` above — never `${{ }}`
      # interpolated into this body, which would be a script-injection surface.
      run: |
        set -euo pipefail

        if [ -z "${PR:-}" ]; then
          echo "::error::No pull request in the event payload. This action must run on a \`pull_request\` trigger."
          exit 1
        fi
        for tool in gh jq timeout; do
          command -v "$tool" >/dev/null 2>&1 || {
            echo "::error::\`$tool\` is not on PATH. GitHub-hosted runners ship all three; a self-hosted runner needs gh, jq and coreutils."
            exit 1
          }
        done
        # Presence is not enough: busybox ships a `timeout` that has neither
        # `--kill-after` nor GNU's duration suffixes, and the ceiling below is not
        # a ceiling without both. Probe the whole invocation on a command that
        # returns at once, so a runner that cannot enforce the ceiling says so here
        # rather than hanging past a deadline it never had. The message names the
        # probe rather than one flag, because either half can be what failed.
        timeout --kill-after=1s 1s true >/dev/null 2>&1 || {
          echo "::error::This \`timeout\` does not support what the gate's hard ceiling needs: \`timeout --kill-after=1s 1s true\` failed. GNU coreutils accepts it; busybox's \`timeout\` has neither the flag nor the \`1s\` suffix. Install coreutils on this runner."
          exit 1
        }
        # Every numeric input, checked before anything computes with it. Each one
        # fails differently when it is not a number, and all three failures are
        # quiet: `wait-minutes` and `poll-seconds` reach an arithmetic expansion
        # in the ceiling, while `max-rerequests` reaches a `[ ... -lt ]` inside an
        # `if`, where `set -e` does not look — a non-numeric one there simply
        # stops the gate from ever re-requesting a review, and the log says
        # "0 of abc allowed" as if that were a budget.
        for spec in "wait-minutes:$WAIT_MINUTES_IN" \
                    "poll-seconds:$POLL_SECONDS" \
                    "max-rerequests:$MAX_REREQUESTS"; do
          case "${spec#*:}" in ''|*[!0-9]*)
            echo "::error::${spec%%:*} must be a whole number, got '${spec#*:}'."; exit 1 ;;
          esac
        done
        [ "$WAIT_MINUTES_IN" -gt 0 ] || {
          echo "::error::wait-minutes must be greater than zero, got '$WAIT_MINUTES_IN'."; exit 1; }
        [ "$POLL_SECONDS" -gt 0 ] || {
          echo "::error::poll-seconds must be greater than zero, got '$POLL_SECONDS'."; exit 1; }
        # Digits alone are not a number yet: an arithmetic expansion reads a
        # leading zero as octal, so `08` dies there ("value too great for base")
        # taking the step with it and printing no `::error::`, and `030` quietly
        # evaluates as 24 while `sleep` reads the same string as 30 — the ceiling
        # and the loop it bounds would then be running on different numbers.
        # These stay exported, so the script downstream gets the same values.
        WAIT_MINUTES_IN=$(( 10#$WAIT_MINUTES_IN ))
        POLL_SECONDS=$(( 10#$POLL_SECONDS ))
        MAX_REREQUESTS=$(( 10#$MAX_REREQUESTS ))

        export ACTION_PATH="$GITHUB_ACTION_PATH"
        export WAIT_SECONDS=$(( WAIT_MINUTES_IN * 60 ))
        export WAIT_LABEL="${WAIT_MINUTES_IN} min"

        # The hard ceiling is COMPUTED from the wait window, not configured next
        # to it. GitHub cannot derive one from the other — `timeout-minutes` does
        # not read `env` — so a second number here would be one every consumer had
        # to keep in sync with this one, in a different file. Deriving it means the
        # two cannot drift: the ceiling is always the window plus a two-minute
        # grace, leaving the script's own deadline to fire first and print its
        # fail-closed diagnosis before anything kills it.
        #
        # It bounds this STEP, not the job: a composite action cannot set
        # `timeout-minutes`, so it starts when the script does and covers nothing
        # before that. The README says what that leaves to the consumer.
        #
        # The poll interval is IN the sum because the loop is a do-while: it tests
        # the deadline before sleeping, so the last sleep starts inside the window
        # and one more poll runs after it. The script therefore ends up to a full
        # `poll-seconds` past its own window — with `poll-seconds: 300` a
        # window-plus-two-minutes ceiling would fire first and report a hang where
        # the script was merely between polls, which is exactly the diagnosis this
        # ceiling is meant to leave to it.
        hard=$(( WAIT_SECONDS + POLL_SECONDS + 120 ))

        # A ceiling that cannot escalate is not a ceiling. `timeout` sends its
        # signal ONCE and then waits for the child forever, so a process that
        # ignores TERM outlives the deadline it was given and the step hangs there
        # — the very failure this ceiling exists to end. `--kill-after` arms the
        # SIGKILL that actually ends it.
        #
        # Ten seconds: gate.sh installs no signal handler and its only cleanup is
        # three temp files, while `gh` and `sleep` die on TERM at once. A child
        # stuck in an uninterruptible wait outlives any grace — SIGKILL does not
        # reach it either — so a longer one buys nothing.
        #
        # No `--foreground`: without it `timeout` puts the script in its own
        # process group and signals the GROUP, which is what reaches a hung `gh`.
        # With it, only the script would be signalled and the child holding the
        # step open would survive both the TERM and the KILL.
        kill_grace=10

        status=0
        timeout --signal=TERM --kill-after="${kill_grace}s" "${hard}s" \
          bash "$GITHUB_ACTION_PATH/scripts/gate.sh" || status=$?
        case "$status" in
          124)
            echo "::error::The gate ran past its hard ceiling of ${hard}s while its own window is ${WAIT_MINUTES_IN} min — something hung. Terminated; failing closed."
            ;;
          137)
            # 128 + SIGKILL. Normally the ceiling escalating, since nothing else
            # here sends a KILL — but a runner out-of-memory kill lands the same
            # status, so the message names both rather than asserting one.
            echo "::error::The gate was killed with SIGKILL: either it ignored the termination signal at its hard ceiling of ${hard}s and was killed ${kill_grace}s later, or the runner ran out of memory. Failing closed."
            ;;
        esac
        exit "$status"

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Lint the workflows
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/latest/download/actionlint_$(
              curl -fsSL https://api.github.com/repos/rhysd/actionlint/releases/latest | jq -r .tag_name | tr -d v
            )_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Lint the shell
        run: |
          shellcheck --severity=style scripts/gate.sh tests/*.sh tests/mock-bin/*

      - name: Check action.yml parses and keeps its contract
        run: |
          # The defaults are not decoration: tests/classify_test.sh reads the
          # reviewers and markers straight out of this file, so that a default
          # edited here without a matching fixture fails the suite rather than
          # shipping.
          python3 - <<'PY'
          import sys, yaml
          spec = yaml.safe_load(open('action.yml'))
          assert spec['runs']['using'] == 'composite', 'must stay a composite action'
          inputs = spec['inputs']
          for name in ('github-token', 'wait-minutes', 'max-rerequests',
                       'poll-seconds', 'reviewers', 'review-markers',
                       'unable-to-review', 'unable-to-review-markers'):
              assert name in inputs, f'input {name} disappeared'
          markers = [m.strip() for m in inputs['review-markers']['default'].splitlines() if m.strip()]
          assert len(markers) >= 2, 'both review formats must stay covered'
          settled = [m.strip() for m in inputs['unable-to-review-markers']['default'].splitlines() if m.strip()]
          assert settled, 'the settled "nothing to review" answer must stay recognised'
          # Both apostrophes, and the word that tells the settled answer apart
          # from a transient "was unable to review any files". This list is the
          # only one that OPENS a merge, so a marker trimmed too far is the one
          # editing mistake with a merge behind it.
          # Literal, because the obvious substring does not discriminate: "was
          # unable to review any files" CONTAINS "able to review any files".
          assert any("wasn't able" in m for m in settled), "the ASCII apostrophe spelling is gone"
          assert any("wasn\u2019t able" in m for m in settled), 'the typographic apostrophe spelling is gone'
          # Not decoration either: flipping this default turns a merge gate that
          # passes such a PR into one that blocks it, for everyone on the moving
          # major tag. It is a decision, so it fails here rather than shipping.
          assert inputs['unable-to-review']['default'] == 'pass', \
              'the unable-to-review default is part of the contract'
          # An input nothing passes through is an input that does nothing.
          env = [s for s in spec['runs']['steps'] if 'run' in s][0]['env']
          for var in ('UNABLE_POLICY', 'UNABLE_MARKERS', 'HEAD_SHA'):
              assert var in env, f'{var} never reaches the script'
          print('action.yml OK —', len(markers), 'markers,', len(settled), 'settled markers,',
                len([r for r in inputs['reviewers']['default'].splitlines() if r.strip()]), 'reviewers')
          PY

      - name: Classification tests
        run: bash tests/classify_test.sh

      - name: Gate tests
        run: bash tests/gate_test.sh

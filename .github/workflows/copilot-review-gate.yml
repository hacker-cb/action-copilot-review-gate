# This repository gates itself with the action it ships, from the PR's own head —
# note the `./` below rather than a released tag. A change that breaks the gate
# therefore cannot pass its own gate, which is the one test no fixture can stand
# in for: the fixtures say what a Copilot review looked like when they were
# captured, and this says what one looks like today.
name: Copilot review gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read        # needed only to check out the action from this PR
  pull-requests: write  # buys exactly one operation: re-requesting the review

concurrency:
  group: copilot-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-review-gate:
    name: copilot-review-gate
    runs-on: ubuntu-latest
    # The action's ceiling bounds its own step and starts when that step does;
    # this bounds everything before it — a runner stalling on checkout or on
    # fetching the action, which would otherwise sit here for GitHub's default of
    # 360 minutes with the required check pending throughout.
    #
    # 25 against a ceiling of `wait-minutes` + `poll-seconds` + 2 min, which on
    # the defaults used here (15 min, 30 s) is 17.5. The margin is what keeps the
    # gate's own diagnosis as what a genuine timeout shows, instead of a bare
    # cancellation — raising `wait-minutes` or `poll-seconds` here means raising
    # this too.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
